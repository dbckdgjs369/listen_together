<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>같이 듣기</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg:#111; --card:#1a1a1a; --line:#333; --text:#eee; --dim:#888; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
    font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text);
  }
  h1 { font-size: 19px; font-weight: 500; margin: 0; }
  #c {
    font-size: 27px; text-align: center; letter-spacing: 6px; text-indent: 6px; text-transform: uppercase;
    width: min(280px, 100%); padding: 15px 0; border: 1px solid var(--line); border-radius: 14px;
    background: var(--card); color: var(--text); font-family: ui-monospace, Menlo, monospace;
  }
  #c:focus { outline: none; border-color: #666; }
  button {
    font-size: 22px; padding: 22px 52px; border: 0; border-radius: 999px;
    background: #fff; color: #111; font-weight: 600; cursor: pointer;
  }
  #s { font-size: 15px; color: var(--dim); min-height: 22px; text-align: center; max-width: 340px; line-height: 1.5; }
  #s.bad { color: var(--bad); }
  details { max-width: 340px; font-size: 14px; color: var(--dim); line-height: 1.6; }
  summary { cursor: pointer; text-align: center; }
  code { color: var(--text); }
</style>
</head>
<body>
  <h1>🎧 같이 듣기</h1>
  <input id="c" autocomplete="off" autocapitalize="characters" spellcheck="false"
         maxlength="14" placeholder="방 코드" aria-label="방 코드">
  <button id="b">입장</button>
  <div id="s">호스트 화면에 뜬 방 코드를 입력하세요</div>

  <details>
    <summary>안 들어가져요</summary>
    <p>· 호스트 폰과 <b>같은 Wi-Fi</b>(또는 호스트 핫스팟)에 붙어 있어야 합니다.</p>
    <p>· 맥 Chrome 에서 "연결할 수 없음"이 뜨면
      <b>시스템 설정 → 개인정보 보호 및 보안 → 로컬 네트워크</b>에서 Chrome 을 켜고
      Chrome 을 다시 시작하세요. Safari 는 설정 없이 됩니다.</p>
    <p>· 호스트가 공유를 다시 시작하면 코드가 바뀝니다.</p>
  </details>

<script src="roomcode.js"></script>
<script>
  var c = document.getElementById('c'), b = document.getElementById('b'), s = document.getElementById('s');

  function say(msg, bad) { s.textContent = msg; s.className = bad ? 'bad' : ''; }

  // 호스트 주소는 http 사설 IP 라 fetch 로 미리 떠볼 수가 없다(https 페이지의 혼합 콘텐츠 차단).
  // 그래서 확인 없이 **페이지 자체를 이동**시킨다. 최상위 이동은 막히지 않는다.
  function go() {
    var r = RoomCode.decode(c.value);
    if (!r) { say('코드가 맞지 않습니다 — 다시 확인해 주세요', true); c.focus(); return; }
    say('연결 중… (' + r.ip + ')');
    location.href = r.url;
  }

  b.onclick = go;
  c.onkeydown = function (e) { if (e.key === 'Enter') go(); };
  c.oninput = function () { if (s.className) say('호스트 화면에 뜬 방 코드를 입력하세요'); };

  // 링크로 받은 경우(…/#K7Q2F9A) 바로 넘어간다. 해시는 서버로 안 가므로 호스팅 쪽 로그에도 안 남는다.
  var h = decodeURIComponent(location.hash.slice(1));
  if (h) { c.value = h; go(); } else { c.focus(); }

  // 한 번 열어두면 인터넷이 없어도(호스트 핫스팟만 켠 상태) 이 페이지가 뜬다.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
