name: Ieum
options:
  bundleIdPrefix: app.ieum
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  # 기본 언어는 영어. 번역이 없는 언어(일본어 등)는 영어로 뜬다. 문구는 저장소 루트 i18n/ 에서 생성한다.
  developmentLanguage: en

settings:
  base:
    # 팀 ID 는 커밋하지 않는다. 빌드할 때 DEVELOPMENT_TEAM=XXXX 로 넘기거나 Xcode 에서 고른다.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:

  Ieum:
    type: application
    platform: iOS
    sources:
      - Ieum
      - LTShared
    info:
      path: Ieum/Info.plist
      properties:
        # 언어별 값은 Ieum/<언어>.lproj/InfoPlist.strings (i18n/ 에서 생성). 여기는 기본(영어)값이다.
        CFBundleDisplayName: IEUM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        # 화면을 꺼도 계속 들리게. 안드로이드의 포그라운드 서비스 역할이다.
        UIBackgroundModes: [audio]
        # 같은 Wi-Fi 의 방을 찾고 붙으려면 로컬 네트워크 권한이 필요하다. 권한 창 문구이기도 하다.
        NSLocalNetworkUsageDescription: Local network access is needed to find friends' rooms on the same Wi-Fi and to share sound with them.
        CFBundleURLTypes:
          - CFBundleURLName: app.ieum
            CFBundleURLSchemes: [ieum]
        ITSAppUsesNonExemptEncryption: false
    # 초대 QR·링크(https://dbckdgjs369.github.io/listen_together/#코드)를 카메라로 찍으면 앱이 열린다.
    # 그 도메인의 /.well-known/apple-app-site-association 에 '팀ID.번들ID' 가 있어야 한다(블로그 저장소).
    entitlements:
      path: Ieum/Ieum.entitlements
      properties:
        com.apple.developer.associated-domains: [applinks:dbckdgjs369.github.io]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ieum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 아이폰 전용. 타깃 기본값(1,2)이 프로젝트 설정을 덮어 아이패드까지 잡히면, 세로 고정이라 업로드가 거부된다.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: IeumBroadcast
        embed: true
    scheme:
      testTargets: [IeumUITests]

  IeumBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - LTBroadcast
      - LTShared
    preBuildScripts:
      - name: 청취 페이지를 안드로이드 원본에서 뜬다
        script: "\"${SRCROOT}/scripts/gen_page.sh\""
        basedOnDependencyAnalysis: false
    info:
      path: LTBroadcast/Info.plist
      properties:
        CFBundleDisplayName: IEUM
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Local network access is needed to send sound to friends on the same Wi-Fi.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        # ShareView 의 BroadcastPicker 가 "<앱 번들 ID>.broadcast" 로 찾는다. 반드시 맞출 것.
        PRODUCT_BUNDLE_IDENTIFIER: app.ieum.broadcast
        TARGETED_DEVICE_FAMILY: "1"
        # 조각 모드에선 버퍼가 1.3ms 마다 온다. 최적화 없는 Debug 빌드는 못 따라가서 iOS 가
        # 버퍼를 버린다(실측 770→239개/초, 소리의 1/3 이 빠짐). Debug 에서도 최적화한다.
        SWIFT_OPTIMIZATION_LEVEL: -O

  # 개발용 '손가락'. 시스템 방송 창·사파리 재생 버튼을 대신 누른다(DriveTests.swift).
  IeumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [IeumUITests]
    dependencies:
      - target: Ieum
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ieum.uitests
        GENERATE_INFOPLIST_FILE: YES
